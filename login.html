<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — CardMax</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"
      defer
    ></script>
    <script>
      function withOpacity(variable) {
        return ({ opacityValue }) =>
          opacityValue !== undefined
            ? `rgb(var(${variable}) / ${opacityValue})`
            : `rgb(var(${variable}))`;
      }
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              paper: withOpacity("--paper"),
              paper2: withOpacity("--surface-2"),
              ink: withOpacity("--ink"),
              inksoft: withOpacity("--ink-soft"),
              emerald: withOpacity("--emerald"),
              emeraldDeep: withOpacity("--emerald-deep"),
              coral: withOpacity("--coral"),
              gold: withOpacity("--gold"),
              line: withOpacity("--line"),
            },
            fontFamily: {
              display: ["Fraunces", "serif"],
              ui: ["Space Grotesk", "sans-serif"],
              mono: ["IBM Plex Mono", "monospace"],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --paper: 238 241 236;
        --surface: 255 255 255;
        --surface-2: 228 233 225;
        --line: 198 208 194;
        --ink: 20 32 24;
        --ink-soft: 75 86 78;
        --emerald: 47 111 78;
        --emerald-deep: 31 79 55;
        --gold: 201 162 39;
        --coral: 255 107 74;
      }
      html.dark {
        --paper: 15 25 19;
        --surface: 22 34 26;
        --surface-2: 28 42 33;
        --line: 42 58 47;
        --ink: 237 242 234;
        --ink-soft: 159 175 156;
        --emerald: 79 161 121;
        --emerald-deep: 107 190 148;
        --gold: 217 182 70;
        --coral: 255 128 100;
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background: rgb(var(--paper));
        color: rgb(var(--ink));
      }
      .card-surface {
        background: rgb(var(--surface));
      }
      :focus-visible {
        outline: 2px solid rgb(var(--emerald));
        outline-offset: 2px;
        border-radius: 6px;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      .ticket {
        position: relative;
        display: flex;
        border-radius: 20px;
      }
      .ticket .stub {
        position: relative;
        flex-shrink: 0;
      }
      .ticket .stub::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        border-left: 2px dashed currentColor;
        opacity: 0.35;
      }
      .notch {
        position: absolute;
        left: -12px;
        width: 24px;
        height: 24px;
        background: rgb(var(--emerald-deep));
        border-radius: 999px;
      }
      .notch-top {
        top: -12px;
      }
      .notch-bottom {
        bottom: -12px;
      }

      .brand-panel {
        background: rgb(var(--emerald));
      }
      .perforation-edge {
        background-image: radial-gradient(
          circle at 0 0,
          transparent 12px,
          rgb(var(--paper)) 12.5px
        );
        background-size: 100% 40px;
        background-repeat: repeat-y;
      }
    </style>
  </head>
  <body class="font-ui antialiased">
    <div class="lg:grid lg:grid-cols-2 min-h-screen">
      <!-- ============ BRAND PANEL (desktop only) ============ -->
      <aside
        class="hidden lg:flex flex-col justify-between brand-panel text-paper p-12 relative"
      >
        <div class="flex items-center gap-2">
          <div
            class="w-9 h-9 rounded-full bg-paper flex items-center justify-center text-emerald font-display font-semibold"
          >
            C
          </div>
          <span class="font-display text-xl font-semibold tracking-tight"
            >CardMax</span
          >
        </div>

        <div class="max-w-sm">
          <p class="font-display font-semibold text-4xl leading-[1.1] mb-4">
            Turn a gift card into cash in minutes.
          </p>
          <p class="text-paper/75 leading-relaxed">
            Sell e-codes or physical cards, track every trade, get paid straight
            to your account.
          </p>
        </div>

        <div
          class="ticket bg-paper/10 border border-paper/20 text-paper max-w-sm"
        >
          <div class="p-4 flex-1">
            <p class="text-xs text-paper/60 mb-1">Sold today</p>
            <p class="font-display font-semibold text-2xl">
              ₦1,213.64<span class="text-sm font-normal text-paper/60">
                / Steam</span
              >
            </p>
          </div>
          <div class="stub w-3">
            <span class="notch notch-top"></span
            ><span class="notch notch-bottom"></span>
          </div>
        </div>
      </aside>

      <!-- ============ FORM PANEL ============ -->
      <main class="flex flex-col px-6 py-8 sm:px-12 lg:px-16 lg:py-16">
        <div class="flex items-center justify-between mb-10 lg:justify-end">
          <div class="flex items-center gap-2 lg:hidden">
            <div
              class="w-8 h-8 rounded-full bg-emerald flex items-center justify-center text-paper font-display font-semibold text-sm"
            >
              C
            </div>
            <span class="font-display text-lg font-semibold">CardMax</span>
          </div>
          <button
            id="themeToggle"
            class="w-10 h-10 rounded-full card-surface border border-line flex items-center justify-center"
            aria-label="Toggle dark mode"
          >
            <i data-lucide="moon" id="iconMoon" class="w-[17px] h-[17px]"></i>
            <i
              data-lucide="sun"
              id="iconSun"
              class="w-[17px] h-[17px] hidden"
            ></i>
          </button>
        </div>

        <div class="max-w-sm w-full mx-auto my-auto">
          <h1 class="font-display font-semibold text-3xl mb-2">Welcome back</h1>
          <p class="text-inksoft mb-8">
            Log in to trade a card or check your balance.
          </p>

          <form class="space-y-4" onsubmit="return false;">
            <div>
              <label class="block text-xs font-semibold text-inksoft mb-1.5"
                >Email</label
              >
              <input
                type="email"
                required
                class="w-full border border-line rounded-xl px-3 py-2.5 text-sm font-medium card-surface focus:border-emerald outline-none"
                placeholder="you@example.com"
              />
            </div>
            <div>
              <div class="flex items-center justify-between mb-1.5">
                <label class="text-xs font-semibold text-inksoft"
                  >Password</label
                >
                <a
                  href="forgot-password.html"
                  class="text-xs font-semibold text-emerald hover:underline"
                  >Forgot password?</a
                >
              </div>
              <input
                type="password"
                required
                class="w-full border border-line rounded-xl px-3 py-2.5 text-sm font-medium card-surface focus:border-emerald outline-none"
                placeholder="••••••••"
              />
            </div>
            <label class="flex items-center gap-2 text-sm text-inksoft">
              <input
                type="checkbox"
                class="rounded border-line accent-emerald w-4 h-4"
              />
              Keep me logged in
            </label>
            <button
              type="submit"
              class="w-full bg-emerald text-paper font-semibold py-3 rounded-full hover:bg-emeraldDeep transition"
            >
              Log in
            </button>
          </form>

          <div class="flex items-center gap-3 my-6">
            <div class="h-px bg-line flex-1"></div>
            <span class="text-xs text-inksoft">or</span>
            <div class="h-px bg-line flex-1"></div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <button
              class="flex items-center justify-center gap-2 border border-line rounded-xl py-2.5 text-sm font-semibold hover:bg-paper2 transition"
            >
              <span
                class="w-5 h-5 rounded-full bg-coral text-white text-xs font-display font-semibold flex items-center justify-center"
                >G</span
              >
              Google
            </button>
            <button
              class="flex items-center justify-center gap-2 border border-line rounded-xl py-2.5 text-sm font-semibold hover:bg-paper2 transition"
            >
              <span
                class="w-5 h-5 rounded-full bg-ink text-paper text-xs font-display font-semibold flex items-center justify-center"
              ></span>
              Apple
            </button>
          </div>

          <p class="text-center text-sm text-inksoft mt-8">
            Don't have an account?
            <a
              href="signup.html"
              class="font-semibold text-emerald hover:underline"
              >Sign up</a
            >
          </p>
        </div>
      </main>
    </div>

    <script>
      const root = document.documentElement;
      const themeToggle = document.getElementById("themeToggle");
      const iconMoon = document.getElementById("iconMoon");
      const iconSun = document.getElementById("iconSun");
      function applyTheme(isDark) {
        root.classList.toggle("dark", isDark);
        iconMoon.classList.toggle("hidden", isDark);
        iconSun.classList.toggle("hidden", !isDark);
        localStorage.setItem("cardmax-theme", isDark ? "dark" : "light");
      }
      const saved = localStorage.getItem("cardmax-theme");
      applyTheme(
        saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches,
      );
      themeToggle.addEventListener("click", () =>
        applyTheme(!root.classList.contains("dark")),
      );

      document.addEventListener("DOMContentLoaded", () => {
        if (window.lucide) lucide.createIcons();
      });
      if (document.readyState !== "loading" && window.lucide)
        lucide.createIcons();
    </script>
  </body>
</html>
