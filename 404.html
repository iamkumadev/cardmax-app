<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — CardMax</title>
    <meta name="description" content="This page doesn't exist." />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%2216%22 fill=%22%232F6F4E%22/><text x=%2216%22 y=%2222%22 font-family=%22Georgia,serif%22 font-size=%2216%22 fill=%22white%22 text-anchor=%22middle%22>C</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script
      src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"
      defer
    ></script>
  </head>
  <body class="font-ui antialiased">
    <div
      class="min-h-screen flex flex-col items-center justify-center px-6 text-center"
    >
      <div class="ticket bg-emerald text-paper mb-8" style="max-width: 280px">
        <div class="flex-1 p-6">
          <p class="text-xs text-paper/70 mb-1">Status</p>
          <p class="font-display font-semibold text-4xl">404</p>
          <p class="text-xs font-mono text-paper/60 mt-2">Ref · NOT-FOUND</p>
        </div>
        <div class="stub w-14 flex items-center justify-center">
          <span class="notch notch-top"></span>
          <i data-lucide="ticket-x" class="w-5 h-5"></i>
          <span class="notch notch-bottom"></span>
        </div>
      </div>

      <h1 class="font-display font-semibold text-2xl mb-2">
        This card doesn't exist
      </h1>
      <p class="text-inksoft max-w-sm mb-8">
        The page you're looking for was moved, renamed, or never issued in the
        first place.
      </p>

      <div class="flex flex-col sm:flex-row gap-3">
        <a
          href="landing.html"
          class="bg-emerald text-paper font-semibold px-6 py-3 rounded-full hover:bg-emeraldDeep transition"
          >Back to home</a
        >
        <a
          href="index.html"
          class="border border-line font-semibold px-6 py-3 rounded-full hover:bg-paper2 transition"
          >Go to dashboard</a
        >
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (window.lucide) lucide.createIcons();
      });
      if (document.readyState !== "loading" && window.lucide)
        lucide.createIcons();
    </script>
  </body>
</html>
