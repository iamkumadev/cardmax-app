<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up — CardMax</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script
      src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"
      defer
    ></script>
  </head>
  <body class="font-ui antialiased">
    <div class="lg:grid lg:grid-cols-2 min-h-screen">
      <!-- ============ BRAND PANEL (desktop only) ============ -->
      <aside
        class="hidden lg:flex flex-col justify-between brand-panel text-paper p-12 relative"
      >
        <div class="flex items-center gap-2">
          <div
            class="w-9 h-9 rounded-full bg-paper flex items-center justify-center text-emerald font-display font-semibold"
          >
            C
          </div>
          <span class="font-display text-xl font-semibold tracking-tight"
            >CardMax</span
          >
        </div>

        <div class="max-w-sm">
          <p class="font-display font-semibold text-4xl leading-[1.1] mb-4">
            Your first trade takes about two minutes.
          </p>
          <p class="text-paper/75 leading-relaxed">
            Create an account, verify your payout details once, and you're set
            for every trade after.
          </p>
        </div>

        <div
          class="ticket bg-paper/10 border border-paper/20 text-paper max-w-sm"
        >
          <div class="p-4 flex-1">
            <p class="text-xs text-paper/60 mb-1">Sold today</p>
            <p class="font-display font-semibold text-2xl">
              ₦1,213.64<span class="text-sm font-normal text-paper/60">
                / Steam</span
              >
            </p>
          </div>
          <div class="stub w-3">
            <span class="notch notch-top"></span
            ><span class="notch notch-bottom"></span>
          </div>
        </div>
      </aside>

      <!-- ============ FORM PANEL ============ -->
      <main class="flex flex-col px-6 py-8 sm:px-12 lg:px-16 lg:py-16">
        <div class="flex items-center justify-between mb-10 lg:justify-end">
          <div class="flex items-center gap-2 lg:hidden">
            <div
              class="w-8 h-8 rounded-full bg-emerald flex items-center justify-center text-paper font-display font-semibold text-sm"
            >
              C
            </div>
            <span class="font-display text-lg font-semibold">CardMax</span>
          </div>
          <button
            id="themeToggle"
            class="w-10 h-10 rounded-full card-surface border border-line flex items-center justify-center"
            aria-label="Toggle dark mode"
          >
            <i data-lucide="moon" id="iconMoon" class="w-[17px] h-[17px]"></i>
            <i
              data-lucide="sun"
              id="iconSun"
              class="w-[17px] h-[17px] hidden"
            ></i>
          </button>
        </div>

        <div class="max-w-sm w-full mx-auto my-auto">
          <h1 class="font-display font-semibold text-3xl mb-2">
            Create your account
          </h1>
          <p class="text-inksoft mb-8">
            Takes about a minute — no card required to sign up.
          </p>

          <form class="space-y-4" onsubmit="return false;">
            <div>
              <label class="block text-xs font-semibold text-inksoft mb-1.5"
                >Full name</label
              >
              <input
                type="text"
                required
                class="w-full border border-line rounded-xl px-3 py-2.5 text-sm font-medium card-surface focus:border-emerald outline-none"
                placeholder="Your name"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-inksoft mb-1.5"
                >Email</label
              >
              <input
                type="email"
                required
                class="w-full border border-line rounded-xl px-3 py-2.5 text-sm font-medium card-surface focus:border-emerald outline-none"
                placeholder="you@example.com"
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-inksoft mb-1.5"
                >Password</label
              >
              <input
                type="password"
                required
                class="w-full border border-line rounded-xl px-3 py-2.5 text-sm font-medium card-surface focus:border-emerald outline-none"
                placeholder="At least 8 characters"
              />
            </div>
            <label class="flex items-start gap-2 text-sm text-inksoft">
              <input
                type="checkbox"
                required
                class="rounded border-line accent-emerald w-4 h-4 mt-0.5"
              />
              <span
                >I agree to the
                <a href="#" class="text-emerald hover:underline">Terms</a> and
                <a href="#" class="text-emerald hover:underline"
                  >Privacy Policy</a
                ></span
              >
            </label>
            <button
              type="submit"
              class="w-full bg-emerald text-paper font-semibold py-3 rounded-full hover:bg-emeraldDeep transition"
            >
              Create account
            </button>
          </form>

          <div class="flex items-center gap-3 my-6">
            <div class="h-px bg-line flex-1"></div>
            <span class="text-xs text-inksoft">or</span>
            <div class="h-px bg-line flex-1"></div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <button
              class="flex items-center justify-center gap-2 border border-line rounded-xl py-2.5 text-sm font-semibold hover:bg-paper2 transition"
            >
              <span
                class="w-5 h-5 rounded-full bg-coral text-white text-xs font-display font-semibold flex items-center justify-center"
                >G</span
              >
              Google
            </button>
            <button
              class="flex items-center justify-center gap-2 border border-line rounded-xl py-2.5 text-sm font-semibold hover:bg-paper2 transition"
            >
              <span
                class="w-5 h-5 rounded-full bg-ink text-paper text-xs font-display font-semibold flex items-center justify-center"
              ></span>
              Apple
            </button>
          </div>

          <p class="text-center text-sm text-inksoft mt-8">
            Already have an account?
            <a
              href="login.html"
              class="font-semibold text-emerald hover:underline"
              >Log in</a
            >
          </p>
        </div>
      </main>
    </div>

    <script>
      const root = document.documentElement;
      const themeToggle = document.getElementById("themeToggle");
      const iconMoon = document.getElementById("iconMoon");
      const iconSun = document.getElementById("iconSun");
      function applyTheme(isDark) {
        root.classList.toggle("dark", isDark);
        iconMoon.classList.toggle("hidden", isDark);
        iconSun.classList.toggle("hidden", !isDark);
        localStorage.setItem("cardmax-theme", isDark ? "dark" : "light");
      }
      const saved = localStorage.getItem("cardmax-theme");
      applyTheme(
        saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches,
      );
      themeToggle.addEventListener("click", () =>
        applyTheme(!root.classList.contains("dark")),
      );

      document.addEventListener("DOMContentLoaded", () => {
        if (window.lucide) lucide.createIcons();
      });
      if (document.readyState !== "loading" && window.lucide)
        lucide.createIcons();
    </script>
  </body>
</html>
